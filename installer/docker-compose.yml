services:
  evobot:
    env_file:
      - env.txt
    image: evo:${VERSION}
    container_name: evobot
    hostname: evobot
    ports:
      - ${EVO_PORT}:24916
    volumes:
      - ${VOLUME_DIR}/log/EvoBot.log:/opt/evobot/EvoBot.log
      - ${VOLUME_DIR}/config/config.yaml:/opt/evobot/config.yaml
    restart: always
    networks:
      - evo_net

  postgresql:
    image: postgres:16.3-bullseye
    container_name: evo_postgresql
    hostname: postgres
    restart: always
    env_file:
      - env.txt
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${VOLUME_DIR}/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - evo_net

  redis:
    image: redis:7.0-bullseye
    container_name: evo_redis
    hostname: redis
    restart: always
    command: ["redis-server", "/etc/redis.conf", "--requirepass", "$REDIS_PASSWORD"]
    env_file:
      - env.txt
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${VOLUME_DIR}/redis/data:/data
      - ${VOLUME_DIR}/redis/redis.conf:/etc/redis.conf
    healthcheck:
      test: "redis-cli -h 127.0.0.1 -p $$REDIS_PORT -a $$REDIS_PASSWORD info Replication"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - evo_net

networks:
  evo_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET}